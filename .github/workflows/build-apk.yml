name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Find project and build APK
        run: |
          SETTINGS_FILE="$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle or settings.gradle.kts file nahi mili"
            echo "Uploaded repository files:"
            find . -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Android Gradle project found at: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-AI-Companion-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
